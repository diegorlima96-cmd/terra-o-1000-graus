<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | Terraço 1000 Graus</title>

    <!-- SEO & URL -->
    <link rel="canonical" href="https://www.terraco1000graus.com.br/admin">
    <meta name="robots" content="noindex, nofollow">

    <!-- Forçar HTTPS -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">

    <!-- Icons (Phosphor Icons) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body class="admin-body">

    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="admin-logo">
                <a href="../index.html" style="text-decoration: none;">
                    <span class="logo-hot">TERRAÇO</span>
                    <span class="logo-cold">ADMIN</span>
                </a>
            </div>

            <nav class="admin-nav">
                <ul>
                    <li><a href="index.html"><i class="ph ph-squares-four"></i> Dashboard</a></li>
                    <li><a href="produtos.html"><i class="ph ph-ice-cream"></i> Produtos</a></li>
                    <li class="active"><a href="pedidos.html"><i class="ph ph-shopping-cart"></i> Pedidos</a></li>
                    <li><a href="clientes.html"><i class="ph ph-users"></i> Clientes</a></li>
                    <li><a href="relatorios.html"><i class="ph ph-chart-line-up"></i> Relatórios</a></li>
                    <li><a href="configuracoes.html"><i class="ph ph-gear"></i> Configurações</a></li>
                </ul>
            </nav>

            <div class="admin-user">
                <div class="user-avatar"><i class="ph ph-user"></i></div>
                <div class="user-info">
                    <h4>Admin User</h4>
                    <p>Gerente</p>
                </div>
                <a href="login.html" class="logout-btn" title="Sair do Admin" id="logoutBtn"><i
                        class="ph ph-sign-out"></i></a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Topbar -->
            <header class="admin-topbar">
                <button class="menu-toggle" id="menuToggle">
                    <i class="ph ph-list"></i>
                </button>

                <div class="topbar-search">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" placeholder="Buscar pedidos, clientes...">
                </div>

                <div class="topbar-actions">
                    <button class="action-btn"><i class="ph ph-bell"></i><span class="badge">3</span></button>
                    <a href="../index.html" class="btn btn-primary btn-sm" target="_blank">Ver Site</a>
                </div>
            </header>

            <!-- Dashboard Content -->
            <!-- Pedidos Content -->
            <div class="admin-content">
                <div class="content-header">
                    <h2>Gestão de Pedidos</h2>
                    <p>Registre novos pedidos ou acompanhe os existentes.</p>
                </div>

                <!-- Novo Pedido Manual -->
                <div class="settings-card"
                    style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 2rem; border-radius: 12px; margin-top: 2rem; margin-bottom: 3rem;">
                    <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;"><i
                            class="ph ph-shopping-cart-simple"></i> Novo Pedido Manual</h3>
                    <form id="orderForm">
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                            <div class="form-group">
                                <label style="display: block; margin-bottom: 0.4rem; font-size: 0.9rem;">Cliente</label>
                                <input type="text" id="orderClient" class="form-control"
                                    style="width: 100%; padding: 0.7rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: white;"
                                    placeholder="Nome do cliente" required>
                            </div>
                            <div class="form-group">
                                <label
                                    style="display: block; margin-bottom: 0.4rem; font-size: 0.9rem;">Produto/Itens</label>
                                <input type="text" id="orderItems" class="form-control"
                                    style="width: 100%; padding: 0.7rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: white;"
                                    placeholder="Ex: 2x Chocolate" required>
                            </div>
                            <div class="form-group">
                                <label style="display: block; margin-bottom: 0.4rem; font-size: 0.9rem;">Total
                                    (R$)</label>
                                <input type="number" step="0.01" id="orderTotal" class="form-control"
                                    style="width: 100%; padding: 0.7rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: white;"
                                    placeholder="0.00" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary" style="padding: 0.7rem 1.5rem;">Registrar
                            Pedido</button>
                    </form>
                </div>

                <!-- Recent Orders Table -->
                <div class="recent-orders">
                    <h3 style="margin-bottom: 1.5rem;">Histórico de Pedidos</h3>
                    <div class="table-responsive">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Cliente</th>
                                    <th>Itens</th>
                                    <th>Total</th>
                                    <th>Status</th>
                                    <th>Ação</th>
                                </tr>
                            </thead>
                            <tbody id="orderListBody">
                                <!-- Preenchido via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <script>
                document.addEventListener('DOMContentLoaded', () => {
                    const form = document.getElementById('orderForm');
                    const listBody = document.getElementById('orderListBody');

                    const loadOrders = () => {
                        const orders = JSON.parse(localStorage.getItem('siteOrders') || '[]');
                        listBody.innerHTML = '';

                        orders.reverse().forEach((o, index) => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td>#${o.id}</td>
                                <td>${o.client}</td>
                                <td>${o.items}</td>
                                <td>R$ ${parseFloat(o.total).toFixed(2)}</td>
                                <td><span class="status-badge status-${o.status.toLowerCase()}">${o.status}</span></td>
                                <td>
                                    <button class="btn-icon" onclick="deleteOrder(${index})"><i class="ph ph-trash"></i></button>
                                </td>
                            `;
                            listBody.appendChild(tr);
                        });
                    };

                    form.addEventListener('submit', (e) => {
                        e.preventDefault();
                        const orders = JSON.parse(localStorage.getItem('siteOrders') || '[]');

                        const newOrder = {
                            id: Math.floor(Math.random() * 90000) + 10000,
                            client: document.getElementById('orderClient').value,
                            items: document.getElementById('orderItems').value,
                            total: document.getElementById('orderTotal').value,
                            status: 'Pendente',
                            date: new Date().toISOString()
                        };

                        orders.push(newOrder);
                        localStorage.setItem('siteOrders', JSON.stringify(orders));
                        form.reset();
                        loadOrders();
                    });

                    window.deleteOrder = (index) => {
                        const orders = JSON.parse(localStorage.getItem('siteOrders') || '[]');
                        const realIndex = orders.length - 1 - index;
                        orders.splice(realIndex, 1);
                        localStorage.setItem('siteOrders', JSON.stringify(orders));
                        loadOrders();
                    };

                    loadOrders();
                });
            </script>
        </main>
    </div>

    <script src="admin.js"></script>
</body>

</html>
