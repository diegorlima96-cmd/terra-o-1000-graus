<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | Terraço 1000 Graus</title>

    <meta name="robots" content="noindex, nofollow">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 3rem;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .login-logo {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .login-subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--blood-orange);
            background: rgba(255, 69, 0, 0.05);
            box-shadow: 0 0 0 3px rgba(255, 69, 0, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--blood-orange), var(--hot-red));
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            font-family: inherit;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 69, 0, 0.4);
        }

        /* Bg decorations */
        .blob-hot,
        .blob-cold {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 1;
        }

        .blob-hot {
            width: 400px;
            height: 400px;
            background: var(--blood-orange);
            top: -100px;
            right: -100px;
        }

        .blob-cold {
            width: 300px;
            height: 300px;
            background: var(--ice-blue);
            bottom: -50px;
            left: -100px;
        }

        .error-message {
            color: var(--hot-red);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
            background: rgba(255, 0, 0, 0.1);
            padding: 0.5rem;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="blob-hot"></div>
    <div class="blob-cold"></div>

    <div class="login-container">
        <div class="login-logo">
            <span class="logo-hot">TERRAÇO</span>
            <span class="logo-cold">ADMIN</span>
        </div>
        <p class="login-subtitle">Acesso restrito à equipe</p>

        <div class="error-message" id="errorMsg">Usuário ou senha incorretos.</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" class="form-control" placeholder="admin" required
                    autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" class="form-control" placeholder="admin123" required
                    autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login">Entrar</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            // Simulação de login simples (Hardcoded)
            // Para ambiente de testes: usuário admin e senha admin123
            if (user === 'admin' && pass === 'admin123') {
                localStorage.setItem('adminAuth', 'true');
                window.location.replace('index.html');
            } else {
                errorMsg.style.display = 'block';
                // Shake effect on error
                const container = document.querySelector('.login-container');
                container.style.animation = 'shake 0.5s';
                setTimeout(() => container.style.animation = '', 500);
            }
        });

        // Add shake animation
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                20%, 40%, 60%, 80% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);

        // Se já estiver logado, redicionador para o painel
        if (localStorage.getItem('adminAuth') === 'true') {
            window.location.replace('index.html');
        }
    </script>
</body>

</html>
