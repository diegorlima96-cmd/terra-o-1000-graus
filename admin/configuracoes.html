<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | Terraço 1000 Graus</title>

    <!-- SEO & URL -->
    <link rel="canonical" href="https://www.terraco1000graus.com.br/admin">
    <meta name="robots" content="noindex, nofollow">

    <!-- Forçar HTTPS -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">

    <!-- Icons (Phosphor Icons) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body class="admin-body">

    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="admin-logo">
                <a href="../index.html" style="text-decoration: none;">
                    <span class="logo-hot">TERRAÇO</span>
                    <span class="logo-cold">ADMIN</span>
                </a>
            </div>

            <nav class="admin-nav">
                <ul>
                    <li><a href="index.html"><i class="ph ph-squares-four"></i> Dashboard</a></li>
                    <li><a href="produtos.html"><i class="ph ph-ice-cream"></i> Produtos</a></li>
                    <li><a href="pedidos.html"><i class="ph ph-shopping-cart"></i> Pedidos</a></li>
                    <li><a href="posts.html"><i class="ph ph-article"></i> Posts</a></li>
                    <li><a href="clientes.html"><i class="ph ph-users"></i> Clientes</a></li>
                    <li><a href="relatorios.html"><i class="ph ph-chart-line-up"></i> Relatórios</a></li>
                    <li class="active"><a href="configuracoes.html"><i class="ph ph-gear"></i> Configurações</a></li>
                </ul>
            </nav>

            <div class="admin-user">
                <div class="user-avatar"><i class="ph ph-user"></i></div>
                <div class="user-info">
                    <h4>Admin User</h4>
                    <p>Gerente</p>
                </div>
                <a href="login.html" class="logout-btn" title="Sair do Admin" id="logoutBtn"><i
                        class="ph ph-sign-out"></i></a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Topbar -->
            <header class="admin-topbar">
                <button class="menu-toggle" id="menuToggle">
                    <i class="ph ph-list"></i>
                </button>

                <div class="topbar-search">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" placeholder="Buscar pedidos, clientes...">
                </div>

                <div class="topbar-actions">
                    <button class="action-btn"><i class="ph ph-bell"></i><span class="badge">3</span></button>
                    <a href="../index.html" class="btn btn-primary btn-sm" target="_blank">Ver Site</a>
                </div>
            </header>

            <!-- Settings Content -->
            <div class="admin-content">
                <div class="content-header">
                    <h2>Configurações do Site</h2>
                    <p>Ajuste as informações principais da sua sorveteria que aparecem no site.</p>
                </div>

                <div class="settings-card"
                    style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 2rem; border-radius: 12px; margin-top: 2rem; max-width: 800px;">
                    <form id="settingsForm">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                            <div class="form-group">
                                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Nome
                                    da Sorveteria</label>
                                <input type="text" id="storeName" class="form-control"
                                    style="width: 100%; padding: 0.8rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: white;"
                                    placeholder="Terraço 1000 Graus">
                            </div>
                            <div class="form-group">
                                <label
                                    style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">WhatsApp
                                    (apenas números)</label>
                                <input type="text" id="storeWhatapp" class="form-control"
                                    style="width: 100%; padding: 0.8rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: white;"
                                    placeholder="13991838645">
                            </div>
                        </div>

                        <div class="form-group" style="margin-bottom: 1.5rem;">
                            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Endereço
                                / Bairro</label>
                            <input type="text" id="storeAddress" class="form-control"
                                style="width: 100%; padding: 0.8rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: white;"
                                placeholder="Morrinhos, Guarujá - SP">
                        </div>

                        <div class="form-group" style="margin-bottom: 2rem;">
                            <label
                                style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Descrição
                                (Hero)</label>
                            <textarea id="storeDesc" class="form-control"
                                style="width: 100%; padding: 0.8rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: white; min-height: 100px;"
                                placeholder="Descreva sua sorveteria aqui..."></textarea>
                        </div>

                        <div style="display: flex; gap: 1rem;">
                            <button type="submit" class="btn btn-primary" style="padding: 0.8rem 2rem;">Salvar
                                Alterações</button>
                            <p id="saveMsg"
                                style="color: #25D366; display: none; align-items: center; gap: 0.5rem; margin: 0; font-weight: 500;">
                                <i class="ph ph-check-circle"></i> Configurações salvas!</p>
                        </div>
                    </form>
                </div>
            </div>

            <script>
                document.addEventListener('DOMContentLoaded', () => {
                    const form = document.getElementById('settingsForm');
                    const saveMsg = document.getElementById('saveMsg');

                    // Carregar dados salvos
                    const savedData = JSON.parse(localStorage.getItem('siteSettings') || '{}');

                    if (savedData.name) document.getElementById('storeName').value = savedData.name;
                    if (savedData.whatsapp) document.getElementById('storeWhatapp').value = savedData.whatsapp;
                    if (savedData.address) document.getElementById('storeAddress').value = savedData.address;
                    if (savedData.desc) document.getElementById('storeDesc').value = savedData.desc;

                    form.addEventListener('submit', (e) => {
                        e.preventDefault();

                        const settings = {
                            name: document.getElementById('storeName').value,
                            whatsapp: document.getElementById('storeWhatapp').value,
                            address: document.getElementById('storeAddress').value,
                            desc: document.getElementById('storeDesc').value
                        };

                        localStorage.setItem('siteSettings', JSON.stringify(settings));

                        saveMsg.style.display = 'flex';
                        setTimeout(() => {
                            saveMsg.style.opacity = '0';
                            setTimeout(() => {
                                saveMsg.style.display = 'none';
                                saveMsg.style.opacity = '1';
                            }, 500);
                        }, 2000);
                    });
                });
            </script>
        </main>
    </div>

    <script src="admin.js"></script>
</body>

</html>
